/* V7 chemistry animation */
.bondGrow{stroke-dasharray:260;stroke-dashoffset:260;animation:bondGrow .65s cubic-bezier(.18,.86,.22,1) forwards}

@keyframes bondBreak{to{stroke-dashoffset:260;opacity:0}}

.atom-key{display:flex;gap:10px;flex-wrap:wrap;color:#657077}.atom-key span{display:inline-flex;align-items:center;gap:4px}.keydot{width:10px;height:10px;border-radius:50%;display:inline-block}

-top:9px}

const app=document.getElementById('app');const pages=['Bìa sách','Khởi động','Khái niệm & cấu tạo','Tính chất vật lí','Danh pháp','Phản ứng thế','Phản ứng tách','Phòng thí nghiệm','Ứng dụng & môi trường','Ôn tập'];
const themes=[
 {accent:'#e86a12',soft:'#ffd5ae',ink:'#9b470a',tab:'#ffe6d0'},
 {accent:'#f07a24',soft:'#ffdcbc',ink:'#a84f0d',tab:'#ffe9d6'},
 {accent:'#219c9a',soft:'#c8f0ee',ink:'#0f6f6d',tab:'#def8f6'},
 {accent:'#4577f0',soft:'#d6e3ff',ink:'#244eb8',tab:'#e6eeff'},
 {accent:'#9460eb',soft:'#e5d9ff',ink:'#5f2fb1',tab:'#f0e8ff'},
 {accent:'#ea5f7b',soft:'#ffd6df',ink:'#a9344d',tab:'#ffe6eb'},
 {accent:'#2aa66f',soft:'#d1f2e2',ink:'#0f6c46',tab:'#e3f9ef'},
 {accent:'#f0a11f',soft:'#ffe6b6',ink:'#9a6100',tab:'#fff0cf'},
 {accent:'#4799df',soft:'#d3ebff',ink:'#235f8b',tab:'#e6f4ff'},
 {accent:'#e96f4b',soft:'#ffd6c9',ink:'#9b452f',tab:'#ffe8e0'}
];
const PROGRESS_KEY='dan_xuat_halogen_progress_v82';
const totalSections=pages.length-1;
let completed=Array(totalSections+1).fill(false),unlocked=1,current=0,showToc=false;
function recomputeUnlocked(){let u=1;while(u<totalSections&&completed[u])u++;unlocked=Math.min(u,totalSections)}
function persistProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify({completed,unlocked,current,showToc}))}catch(e){}}
function loadProgress(){try{const raw=localStorage.getItem(PROGRESS_KEY);completed=Array(totalSections+1).fill(false);unlocked=1;if(raw){const data=JSON.parse(raw);if(Array.isArray(data.completed)){for(let i=1;i<=totalSections;i++)completed[i]=!!data.completed[i]}recomputeUnlocked()}current=0;showToc=false}catch(e){completed=Array(totalSections+1).fill(false);unlocked=1;current=0;showToc=false}}
function markComplete(i=current){if(i>=1&&i<=totalSections){completed[i]=true;recomputeUnlocked();persistProgress()}}
function canOpen(i){return i>=1&&i<=unlocked}
function goSection(i){if(!canOpen(i))return;current=i;showToc=false;persistProgress();render()}
function goToc(){showToc=true;persistProgress();render()}
function beginNewCourse(){
 completed=Array(totalSections+1).fill(false);
 unlocked=1;
 current=0;
 showToc=true;
 try{localStorage.removeItem(PROGRESS_KEY)}catch(e){}
 persistProgress();
 render();
}

function mountMol3D(rootId,key,xSymbol){
 const root=document.getElementById(rootId); if(!root)return;

 function proj(a){let x=a[1],y=a[2],z=a[3];let cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);let x1=x*cy+z*sy,z1=-x*sy+z*cy;let y1=y*cx-z1*sx,z2=y*sx+z1*cx;let p=1/(1+z2*.18);return {x:450+x1*105*p,y:165+y1*105*p,z:z2,p};}
 function line(a,b){let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);let el=document.createElementNS('http://www.w3.org/2000/svg','line');el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y);el.setAttribute('stroke','#69747a');el.setAttribute('stroke-width','7');el.setAttribute('stroke-linecap','round');el.setAttribute('opacity',String(.72+.2*((a.p+b.p)/2)));return el;}
 function draw(){const bp=root.querySelector('#molBonds'),ap=root.querySelector('#molAtoms');bp.innerHTML='';ap.innerHTML='';const pts=data.atoms.map(proj);data.bonds.forEach(([i,j])=>bp.appendChild(line(pts[i],pts[j])));pts.map((p,i)=>({p,i})).sort((a,b)=>a.p.z-b.p.z).forEach(({p,i})=>{let a=data.atoms[i],g=document.createElementNS('http://www.w3.org/2000/svg','g'),r=a[5]*p.p;let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',r);c.setAttribute('fill',a[4]);c.setAttribute('stroke',a[0]==='H'?'#9aa2a7':'#fff');c.setAttribute('stroke-width','2');g.appendChild(c);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',p.x);t.setAttribute('y',p.y+5);t.setAttribute('text-anchor','middle');t.setAttribute('font-size',Math.max(11, r*.7));t.setAttribute('font-weight','900');t.setAttribute('fill',a[0]==='H'?'#4e575c':'#fff');t.textContent=a[0];g.appendChild(t);ap.appendChild(g);});}
 svg.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;ay+=(e.clientX-px)*.012;ax+=(e.clientY-py)*.012;px=e.clientX;py=e.clientY;draw()};svg.onpointerup=()=>drag=false;svg.onpointercancel=()=>drag=false;

 const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};let dragScope='';

 const chainInfo={
  ethane:{n:2,label:'ethane'},
  propane:{n:3,label:'propane'},
  butane:{n:4,label:'butane'},

 };
 const haloInfo={
  chloro:{symbol:'Cl',count:1,color:'#62ad72'},
  bromo:{symbol:'Br',count:1,color:'#a85e3b'},
  iodo:{symbol:'I',count:1,color:'#7757d8'},

 function parseLocants(w){
  return String(w||'').replace(/-$/,'').split(',').map(Number).filter(Number.isFinite)
 }
 function cmpLex(a,b){
  for(let i=0;i<Math.max(a.length,b.length);i++){
   const av=a[i]??999,bv=b[i]??999;
   if(av!==bv)return av-bv
  }
  return 0
 }
 function evaluateHaloName(seq){
  if(seq.length!==3)return {valid:false,reason:'Hãy chọn đủ ba thành phần của tên.'};
  if(seq.map(x=>x.type).join('')!=='ABC')return {valid:false,reason:'Thứ tự tên chưa đúng. Hãy xếp: số chỉ vị trí → halogen → mạch chính.'};
  const locants=parseLocants(seq[0].w),halo=haloInfo[seq[1].w],chain=chainInfo[seq[2].w];
  if(!halo||!chain)return {valid:false,reason:'Tổ hợp này chưa tạo được tên hợp lệ.'};
  if(locants.length!==halo.count)return {valid:false,reason:'Số lượng chỉ số vị trí chưa phù hợp với tiền tố halogen.'};
  if(locants.some(x=>x<1||x>chain.n))return {valid:false,reason:'Số chỉ vị trí nằm ngoài mạch carbon đã chọn.'};
  const sorted=[...locants].sort((a,b)=>a-b);
  if(sorted.some((x,i)=>x!==locants[i]))return {valid:false,reason:'Các số chỉ vị trí phải được viết theo thứ tự tăng dần.'};
  const reversed=sorted.map(x=>chain.n+1-x).sort((a,b)=>a-b);
  const canonical=cmpLex(sorted,reversed)<=0?sorted:reversed;
  if(sorted.some((x,i)=>x!==canonical[i]))return {valid:false,reason:'Tên chưa theo quy tắc bộ số chỉ vị trí nhỏ nhất của IUPAC.'};

  const name=seq.map(x=>x.w).join('');
  const hCount=2*chain.n+2-halo.count;
  const formula=`C${chain.n}H${hCount}${halo.symbol}${halo.count>1?halo.count:''}`;
  return {valid:true,name,chainN:chain.n,chainName:chain.label,locants:sorted,halo,formula}
 }

 function subDigits(s){
  return String(s).replace(/\d/g,d=>({'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'}[d]))

 function buildHaloalkaneSvg(info){
  const n=info.chainN,W=760,H=330,y=164;
  const left=95,right=665,step=n===1?0:(right-left)/(n-1);
  const xs=Array.from({length:n},(_,i)=>left+i*step);
  const haloAt=Array.from({length:n},()=>[]);
  info.locants.forEach(loc=>haloAt[loc-1].push(info.halo));

  const parts=[];
  parts.push(`<svg viewBox="0 0 ${W} ${H}" aria-label="Mô hình cấu tạo đầy đủ ${info.name}">`);
  // carbon-carbon bonds
  for(let i=0;i<n-1;i++){
   parts.push(`<line x1="${xs[i]+27}" y1="${y}" x2="${xs[i+1]-27}" y2="${y}" stroke="#667177" stroke-width="7" stroke-linecap="round"/>`)
  }

  // attachment directions
  const attach=(i)=>{
   if(i===0)return [[-48,-54],[-66,0],[-48,54]];
   if(i===n-1)return [[48,-54],[66,0],[48,54]];
   return [[0,-66],[0,66]]
  };

  for(let i=0;i<n;i++){
   const carbonNeighbors=(i===0||i===n-1)?1:2;
   const hs=4-carbonNeighbors-haloAt[i].length;
   const dirs=attach(i);
   const atoms=[...haloAt[i].map(h=>({kind:'X',symbol:h.symbol,color:h.color})),...Array.from({length:hs},()=>({kind:'H',symbol:'H',color:'#f8f8f8'}))];
   atoms.forEach((a,k)=>{
    const [dx,dy]=dirs[k]||[0,(k%2?1:-1)*(66+24*k)];
    const ax=xs[i]+dx,ay=y+dy;
    parts.push(`<line x1="${xs[i]+Math.sign(dx)*20}" y1="${y+Math.sign(dy)*20}" x2="${ax-Math.sign(dx)*15}" y2="${ay-Math.sign(dy)*15}" stroke="${a.kind==='X'?a.color:'#7b858b'}" stroke-width="${a.kind==='X'?6:5}" stroke-linecap="round"/>`);
    if(a.kind==='H'){
     parts.push(`<circle cx="${ax}" cy="${ay}" r="17" fill="#f8f8f8" stroke="#9aa2a7" stroke-width="1.5"/><text x="${ax}" y="${ay+5}" text-anchor="middle" font-size="11" font-weight="900" fill="#4e585e">H</text>`)
    }else{
     parts.push(`<circle cx="${ax}" cy="${ay}" r="20" fill="${a.color}"/><text x="${ax}" y="${ay+5}" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">${a.symbol}</text>`)
    }
   })
  }

  // carbon nodes on top
  xs.forEach(x=>{
   parts.push(`<circle cx="${x}" cy="${y}" r="28" fill="#555" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="17" font-weight="900" fill="#fff">C</text>`)
  });
  parts.push('</svg>');
  const prettyFormula=subDigits(info.formula);
  parts.push(`<div class="small" style="text-align:center;margin-top:4px"><b>${info.name}</b> · Công thức phân tử ${prettyFormula}</div>`);
  return parts.join('')
 }

 app.querySelectorAll('#quiz9 .qcard').forEach(x=>x.classList.remove('reviewWrong'));results.forEach((ok,i)=>{if(!ok)app.querySelector('#q9-'+(i+1)).classList.add('reviewWrong')});
 const wrong=results.map((ok,i)=>ok?null:i).filter(i=>i!==null),list=app.querySelector('#q9ReviewList');app.querySelector('#q9ScoreBig').textContent=score+'/9';app.querySelector('#q9ResultTitle').textContent=wrong.length?'Các câu cần ôn lại':'Hoàn thành xuất sắc';
 app.querySelector('#q9ResultMsg').textContent=wrong.length?'Hệ thống chỉ hiển thị những câu em làm sai. Đọc phần “Ôn nhanh” để củng cố đúng mạch kiến thức trước khi làm lại.':'Em đã trả lời đúng cả 9 câu.';
 list.innerHTML=wrong.length?wrong.map(i=>'<div class="reviewItem"><b>Câu '+(i+1)+' chưa chính xác</b><div style="margin-top:6px"><strong>Đáp án cần nhớ:</strong> '+reviewData[i].answer+'</div><div class="reviewTheory"><strong>Ôn nhanh:</strong> '+reviewData[i].theory+'</div><button class="btn ghost q9GoWrong" data-q="'+(i+1)+'" style="margin-top:9px">Xem lại câu '+(i+1)+'</button></div>').join(''):'<div class="callout"><b>9/9.</b> Em đã nối đúng các kiến thức từ nhận diện, danh pháp, phản ứng đến thí nghiệm.</div>';
 app.querySelector('#q9Result').classList.add('show');app.querySelector('#q9SubmitArea').style.display='none';app.querySelectorAll('.q9GoWrong').forEach(b=>b.onclick=()=>app.querySelector('#q9-'+b.dataset.q).scrollIntoView({behavior:'smooth',block:'start'}));app.querySelector('#q9Result').scrollIntoView({behavior:'smooth',block:'start'});
}
submitBtn.onclick=submitQuiz;

function resetQuizData(doScroll=true){
 submitted=false;answered.fill(false);q8Touched=false;app.querySelectorAll('#quiz9 .quizOpt').forEach(x=>x.classList.remove('selected'));app.querySelectorAll('#quiz9 .qcard').forEach(x=>x.classList.remove('reviewWrong'));app.querySelectorAll('#tfBox .tfrow').forEach(r=>{delete r.dataset.value;r.querySelectorAll('.tfbtn').forEach(b=>b.classList.remove('selected'))});app.querySelectorAll('#q9-6 select').forEach(s=>s.value='');app.querySelector('#q9Input4').value='';app.querySelectorAll('.q9iupac').forEach(inp=>inp.value='');slots.forEach(s=>{delete s.dataset.value;s.textContent='Thả tên vào đây';s.classList.remove('filled')});chips.forEach(c=>c.classList.remove('active'));activeChip=null;const map={heat:null,agno3:null,mix:null};[...order.children].forEach(x=>map[x.dataset.id]=x);order.append(map.heat,map.agno3,map.mix);renum();app.querySelector('#q9Result').classList.remove('show');app.querySelector('#q9ReviewList').innerHTML='';app.querySelector('#q9SubmitArea').style.display='block';refreshAnswered();if(doScroll)window.scrollTo({top:0,behavior:'smooth'})
}

let examActive=false,warningCount=0,lastViolationAt=0;
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
async function enterFullscreen(){try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}}
async function leaveFullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(e){}}
function syncWarn(){warningBadge.textContent=Math.min(warningCount,3)+'/3'}
function showGuard(reason){guard.classList.add('show');guardCount.textContent='Cảnh báo '+warningCount+'/3';guardText.textContent=reason+' Hãy quay lại chế độ toàn màn hình để tiếp tục.'}
function hardReset(reason){examActive=false;guard.classList.remove('show');resetQuizData(false);warningCount=0;syncWarn();quiz9.classList.remove('exam-active');document.body.classList.remove('q9-focus');restartMsg.classList.add('show');restartMsg.innerHTML='<b>Phiên ôn tập đã được đặt lại.</b> '+reason+' Toàn bộ câu trả lời trước đó đã bị xóa.';leaveFullscreen();window.scrollTo({top:app.querySelector('#quiz9').offsetTop-20,behavior:'smooth'})}
function violation(reason){if(!examActive)return;const now=Date.now();if(now-lastViolationAt<1600)return;lastViolationAt=now;warningCount++;syncWarn();if(warningCount>3){hardReset('Em đã vượt quá 3 lần cảnh báo.');return}showGuard(reason)}
startBtn.onclick=async()=>{warningCount=0;syncWarn();restartMsg.classList.remove('show');restartMsg.innerHTML='';resetQuizData(false);quiz9.classList.add('exam-active');document.body.classList.add('q9-focus');examActive=true;guard.classList.remove('show');lastViolationAt=0;await enterFullscreen();window.scrollTo({top:0,behavior:'instant'})};
continueBtn.onclick=async()=>{guard.classList.remove('show');await enterFullscreen()};
function onVisibility(){if(examActive&&document.hidden)violation('Em đã chuyển sang tab hoặc cửa sổ khác.')}
function onFullscreen(){if(examActive&&!isFullscreen()&&!document.hidden)violation('Em đã thoát khỏi chế độ toàn màn hình.')}
document.addEventListener('visibilitychange',onVisibility);document.addEventListener('fullscreenchange',onFullscreen);document.addEventListener('webkitfullscreenchange',onFullscreen);
app.querySelector('#q9Retry').onclick=async()=>{resetQuizData(false);warningCount=0;syncWarn();examActive=true;document.body.classList.add('q9-focus');await enterFullscreen();window.scrollTo({top:0,behavior:'smooth'})};
app.querySelector('#q9Finish').onclick=()=>{examActive=false;guard.classList.remove('show');document.body.classList.remove('q9-focus');leaveFullscreen();quiz9.classList.remove('exam-active');window.scrollTo({top:app.querySelector('#quiz9').offsetTop-20,behavior:'smooth'})};
refreshAnswered()}

function render(){if(showToc){pageToc();return}[pageCover,page0,page1,page2,page3,page4,page5,page6,page7,page8][current]()}render();
